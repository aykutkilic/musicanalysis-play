<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Music analysis room</title>
<meta name="theme-color" content="#1d140d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236b4a34'/%3E%3Cpath d='M6 9h20M6 13h20M6 17h20M6 21h20' stroke='%23f3ead8' stroke-width='1.3'/%3E%3Cellipse cx='13' cy='21' rx='3.4' ry='2.5' fill='%23f3ead8'/%3E%3Cpath d='M16.2 21V8' stroke='%23f3ead8' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="v/0861af9-20261127073718/client/style.css">
</head>
<body>
<canvas id="view"></canvas>
<header id="bar">
  <button id="shelfBtn" title="To the bookshelf">Shelf</button><button id="deskBtn" title="To the desk">Desk</button><button id="pianoBtn" title="To the piano">Piano</button>
  <span class="sep"></span>
  <button id="formBtn" title="The form: sections and structure">Form</button><button id="mapBtn" title="Read the map sheet">Map</button><button id="rollBtn" title="Read the piano roll">Roll</button><button id="fitBtn" title="Back to the whole view (0)">⤢</button>
  <b id="heading">Take a book from the shelf</b><button id="now" hidden title="The section playing now"></button><span class="grow"></span>
  <button id="playBtn" class="main" disabled>▶ Play</button>
  <label class="tempo" title="Tempo">♩<input id="rate" type="range" min="50" max="150" value="100"><span id="rateOut">100%</span></label>
  <label id="hearWrap" class="tempo" hidden title="A recording: hear it, or the notes heard in it">Hear <select id="hear"><option value="recording">the recording</option><option value="notes">the notes heard</option></select></label>
  <button id="addBtn" title="Put a MIDI, MusicXML or audio file on the shelf">+ Add a piece</button>
  <input id="file" type="file" accept=".mid,.midi,.xml,.musicxml,.mxl,audio/*,.wav,.mp3,.m4a,.aac,.flac,.ogg,.oga,.opus,.webm,.aif,.aiff" hidden>
</header>
<div id="rollBar" hidden>
  <label>Pitch <select id="axis"><option value="chromatic">chromatic</option><option value="degree">scale degrees</option></select></label>
  <label>Bars <select id="span"><option>2</option><option selected>4</option><option>6</option><option>8</option></select></label>
  <button id="prevBars" title="Earlier">‹</button><button id="nextBars" title="Later">›</button>
  <span id="legend"></span>
</div>
<aside id="card" hidden>
  <button class="x" id="cardX" title="Close">×</button>
  <p class="layer" id="cardLayer"></p>
  <h2 id="cardTitle"></h2>
  <p id="cardSure"></p>
  <p id="cardWhy"></p>
  <div id="cardAlts"></div>
  <div class="row"><button id="cardPlay">▶ Hear it</button><button id="cardUnpin" hidden>Unpin</button></div>
</aside>
<dialog id="book">
  <h2 id="bookTitle"></h2>
  <ul id="movements"></ul>
  <button class="shut">Close</button>
</dialog>
<div id="toasts"></div>
<div id="drop" hidden>Drop a MIDI, MusicXML or audio file to put it on the shelf</div>
<footer id="credit">Mozart's notes from the <a href="https://github.com/DCMLab/mozart_piano_sonatas" target="_blank" rel="noopener">DCML Mozart sonatas</a> (CC BY-NC-SA 4.0) · sound: GeneralUser GS, SpessaSynth · three.js</footer>
<script type="module" src="v/0861af9-20261127073718/client/main.js"></script>
</body>
</html>
